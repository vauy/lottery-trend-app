name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # expo prebuild 用了 patched expo 依赖 + resolution-mode:highest，需绕过依赖校验
      EXPO_NO_DEPENDENCY_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 安装 Android SDK + RN 0.81 必需的 NDK / CMake（原生 C++ 编译依赖）
      - id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client/android/**/*.gradle*') }}
          restore-keys: |
            gradle-

      - name: Install JS deps (pnpm workspace)
        run: pnpm install --no-frozen-lockfile

      # 生成原生 android/ 工程（Expo 54 / RN 0.81 模板：compileSdk 35, minSdk 24, NDK 27.1.12297006）
      - name: Expo prebuild (android)
        working-directory: client
        run: pnpm exec expo prebuild --platform android --clean

      # 生成调试/自签名 keystore，使 release APK 可直接安装（无需你提供密钥）
      - name: Generate signing keystore
        working-directory: client/android/app
        run: |
          keytool -genkeypair -v \
            -keystore release-key.keystore \
            -alias lottery -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=lottery,O=lottery,C=CN"
          printf 'password=android\nkeyAlias=lottery\nkeyPassword=android\nstoreFile=release-key.keystore\n' > keystore.properties

      - name: Build signed release APK
        working-directory: client/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify APK signed
        working-directory: client/android/app/build/outputs/apk/release
        run: |
          ls -lh app-release.apk
          unzip -l app-release.apk | grep -q "META-INF/.*\.RSA" && echo "APK 已签名 ✓" || echo "警告：APK 未签名"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lottery-android-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
