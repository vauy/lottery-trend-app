name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('client/android/**/*.gradle*') }}
          restore-keys: |
            gradle-release-

      - run: pnpm install --no-frozen-lockfile

      - name: Prebuild (release)
        working-directory: client
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: client/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dev-${{ hashFiles('client/android/**/*.gradle*') }}
          restore-keys: |
            gradle-dev-

      - run: pnpm install --no-frozen-lockfile

      - name: Prebuild (dev)
        working-directory: client
        env:
          APP_VARIANT: development
        run: npx expo prebuild --platform android --clean

      - name: Build dev APK (debug)
        working-directory: client/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
